name: fetch-lottery

on:
  schedule:
    # 北京时间每天 22:30（双色球/大乐透当日开奖结束后）
    - cron: '30 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-lottery
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.49.1 playwright-extra puppeteer-extra-plugin-stealth >/dev/null
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y xvfb

      # 有头浏览器（xvfb 虚拟显示）+ stealth，过反爬指纹检测
      # 两个玩法互不拖累：一个失败另一个照常入库，最后统一校验并让任务标红
      - name: Fetch 双色球 (cwl.gov.cn)
        id: ssq
        continue-on-error: true
        run: xvfb-run -a node scripts/fetch.mjs ssq

      - name: Fetch 大乐透 (sporttery.cn)
        id: dlt
        continue-on-error: true
        run: xvfb-run -a node scripts/fetch.mjs dlt

      - name: Commit data
        run: |
          git config user.name "lottery-bot"
          git config user.email "daipenn@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: $(date -u +%FT%TZ 更新开奖数据)"
            git push
          fi

      - name: Verify data files
        run: |
          ok=true
          [ -f data/ssq.json ] || { echo "::error::双色球数据缺失"; ok=false; }
          [ -f data/dlt.json ] || { echo "::error::大乐透数据缺失"; ok=false; }
          $ok
